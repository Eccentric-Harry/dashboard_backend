spring.application.name=backend

# MongoDB Configuration
spring.mongodb.uri=${SPRING_MONGODB_URI:}
spring.mongodb.database=personal_dashboard

# Disable MongoDB health indicator
management.health.mongodb.enabled=false

# Gzip JSON responses. The nutrition history/analytics endpoints return long, highly
# repetitive arrays that compress ~8-10x; without this they went over the wire raw.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript
server.compression.min-response-size=1024

# Keep health endpoint enabled
management.endpoints.web.exposure.include=health,info,metrics

# Strava API Configuration
strava.api.base-url=https://www.strava.com/api/v3
strava.api.access-token=${STRAVA_ACCESS_TOKEN:}

# Notion Integration Configuration
notion.api.token=${NOTION_API_TOKEN:}
notion.database.id=${NOTION_DATABASE_ID:}

# SpringDoc OpenAPI (Swagger UI) Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.profiles.active=local

# Multipart file upload limits (AI meal scan accepts up to 3 images @ 10MB each)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB

# Nutrition AI Configuration
# Gemini is the PRIMARY vision provider; Claude is the fallback (used when Gemini errors/is unavailable).
ai.providers.gemini.endpoint=${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}
ai.providers.gemini.api-key=${GEMINI_API_KEY:GEMINI_KEY_NOT_SET}
ai.providers.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# Gemini image generation (pastel dish thumbnail per AI-scanned meal) was REMOVED —
# it was a second paid model call per meal log for decoration. Meals now always use the
# bundled keyword-matched asset on the frontend. See GeminiImageGenerationService in git
# history if it ever needs to come back.

ai.providers.claude.api-key=${ANTHROPIC_API_KEY:ANTHROPIC_KEY_NOT_SET}
ai.providers.claude.model=${ANTHROPIC_MODEL:claude-sonnet-5}
# The fallback only runs after Gemini has already failed, so it has the least time left
# before the client stops polling. Unbounded here would pin a pooled thread indefinitely.
ai.providers.claude.timeout-ms=${ANTHROPIC_TIMEOUT_MS:45000}

# Gemini token pricing, USD per million tokens. Used only to annotate each call's
# estimated cost in the logs so spend is attributable per pipeline stage.
ai.providers.gemini.price.input-per-million=${GEMINI_PRICE_INPUT:1.50}
ai.providers.gemini.price.output-per-million=${GEMINI_PRICE_OUTPUT:7.50}
ai.providers.gemini.price.cached-input-per-million=${GEMINI_PRICE_CACHED_INPUT:0.15}

# Used only to render the per-analysis cost in rupees alongside the dollar figure.
ai.providers.usd-to-inr=${USD_TO_INR:95.3}

# ── Nutrient ground truth ────────────────────────────────────────────────────
# Macros are no longer recalled by the model. Each ingredient resolves against the
# embedded table in resources/nutrition/usda-core.json first, then a shared Mongo
# cache, then the live FoodData Central API. Without a key the live tier is simply
# skipped and unmatched ingredients are reported as unmatched, never guessed.
# Free key: https://fdc.nal.usda.gov/api-key-signup.html
nutrition.usda.api-key=${USDA_FDC_API_KEY:}
nutrition.usda.search-endpoint=${USDA_FDC_SEARCH_ENDPOINT:https://api.nal.usda.gov/fdc/v1/foods/search}
nutrition.usda.live-lookup-enabled=${USDA_LIVE_LOOKUP_ENABLED:true}

# api.data.gov allows 1000 requests/hour/key and answers a breach with a one-hour
# block, so the local budget stays below it. Headroom covers other deployments
# sharing the same key.
nutrition.usda.hourly-budget=${USDA_HOURLY_BUDGET:800}

# This call sits on a user-facing path. Defaults are deliberately short: an
# unmatched ingredient is reported honestly, whereas a hung request is a broken log.
nutrition.usda.connect-timeout-ms=${USDA_CONNECT_TIMEOUT_MS:2000}
nutrition.usda.read-timeout-ms=${USDA_READ_TIMEOUT_MS:4000}

# Branded records are label-derived and noisier than the analytical datasets, and a
# wrong branded match corrupts a health log more than a missing one does.
nutrition.usda.include-branded=${USDA_INCLUDE_BRANDED:false}

# ── Stage tuning ─────────────────────────────────────────────────────────────
# The client polls for the job with a bounded deadline, so the two paid stages must
# finish well inside it WITH room for one fallback attempt. "high" thinking on
# extraction overran that budget in production and surfaced as an analysis timeout;
# "medium" keeps the recognition quality that matters while fitting the envelope.
nutrition.stage.extraction.thinking-level=${EXTRACTION_THINKING_LEVEL:medium}
nutrition.stage.extraction.media-resolution=${EXTRACTION_MEDIA_RESOLUTION:media_resolution_high}
nutrition.stage.extraction.timeout-ms=${EXTRACTION_TIMEOUT_MS:75000}

# Narrative has no arithmetic left to reason toward — the figures arrive as fact.
nutrition.stage.narrative.thinking-level=${NARRATIVE_THINKING_LEVEL:low}
nutrition.stage.narrative.timeout-ms=${NARRATIVE_TIMEOUT_MS:45000}

# Content-addressed cache over the two paid model stages. A repeated meal costs nothing.
nutrition.cache.enabled=${NUTRITION_CACHE_ENABLED:true}

# Google Calendar Integration
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:dummy-client-id}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:dummy-client-secret}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/google-calendar/auth/callback}
google.calendar.webhook-url=${GOOGLE_CALENDAR_WEBHOOK_URL:http://localhost:8080/api/webhooks/google-calendar}
google.sync.encryption-key=${GOOGLE_SYNC_ENCRYPTION_KEY:dev-encryption-key-for-google-calendar-sync-tokens-1234}

