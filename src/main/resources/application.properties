spring.application.name=backend

# MongoDB Configuration
spring.mongodb.uri=${SPRING_MONGODB_URI:}
spring.mongodb.database=personal_dashboard

# Disable MongoDB health indicator
management.health.mongodb.enabled=false

# Keep health endpoint enabled
management.endpoints.web.exposure.include=health,info,metrics

# Strava API Configuration
strava.api.base-url=https://www.strava.com/api/v3
strava.api.access-token=${STRAVA_ACCESS_TOKEN:}

# Notion Integration Configuration
notion.api.token=${NOTION_API_TOKEN:}
notion.database.id=${NOTION_DATABASE_ID:}

# SpringDoc OpenAPI (Swagger UI) Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
spring.profiles.active=local

# Multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Nutrition AI Configuration
ai.providers.gemini.endpoint=${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent}
ai.providers.gemini.api-key=${GEMINI_API_KEY:GEMINI_KEY_NOT_SET}
ai.providers.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}

ai.providers.groq.endpoint=${GROQ_API_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
ai.providers.groq.api-key=${GROQ_API_KEY:GROQ_KEY_NOT_SET}
ai.providers.groq.model=${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}

# Google Calendar Integration
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:dummy-client-id}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:dummy-client-secret}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/google-calendar/auth/callback}
google.calendar.webhook-url=${GOOGLE_CALENDAR_WEBHOOK_URL:http://localhost:8080/api/webhooks/google-calendar}
google.sync.encryption-key=${GOOGLE_SYNC_ENCRYPTION_KEY:dev-encryption-key-for-google-calendar-sync-tokens-1234}

